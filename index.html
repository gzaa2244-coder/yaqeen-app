<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منصة اليقين</title>
<meta name="description" content="القرآن الكريم، مواقيت الصلاة، القبلة، الأذكار، واسأل نور">
<meta name="theme-color" content="#151311">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="اليقين">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;600&display=swap">
<style>
  :root{ --bg:#151311; --card:#211e1a; --gold:#c9a45c; --gold-2:#f3dc9b; --text:#f2ecdf; --muted:#a9a293; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family:'Noto Kufi Arabic', system-ui, sans-serif; overflow:hidden; }
  #app{ position:fixed; inset:0; width:100%; height:100%; border:0;
    padding-top:env(safe-area-inset-top); background:var(--bg); }
  #splash{ position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:18px; background:var(--bg); transition:opacity .5s; z-index:5; }
  #splash img{ width:112px; height:112px; border-radius:26px; box-shadow:0 10px 40px rgba(201,164,92,.18); }
  #splash h1{ margin:0; font-size:22px; font-weight:600; color:var(--gold-2); }
  #splash p{ margin:0; font-size:13px; color:var(--muted); text-align:center; padding:0 24px; line-height:1.9; }
  .dots{ display:flex; gap:6px; } .dots span{ width:7px; height:7px; border-radius:50%; background:var(--gold);
    animation:b 1.2s infinite ease-in-out; } .dots span:nth-child(2){animation-delay:.15s} .dots span:nth-child(3){animation-delay:.3s}
  @keyframes b{ 0%,80%,100%{ opacity:.25; transform:scale(.8) } 40%{ opacity:1; transform:scale(1) } }
  #install{ position:fixed; left:16px; right:16px; bottom:calc(16px + env(safe-area-inset-bottom)); z-index:10;
    background:var(--card); border:1px solid rgba(201,164,92,.35); border-radius:18px; padding:14px 16px;
    display:none; align-items:center; gap:12px; box-shadow:0 12px 40px rgba(0,0,0,.45); max-width:520px; margin:0 auto; }
  #install img{ width:44px; height:44px; border-radius:11px; flex:none; }
  #install .t{ flex:1; font-size:13px; line-height:1.8; } #install b{ color:var(--gold-2); font-weight:600; }
  #install button{ font:inherit; border:0; border-radius:12px; padding:9px 14px; cursor:pointer; }
  #go{ background:var(--gold); color:#1d1a17; font-weight:600; } #x{ background:transparent; color:var(--muted); }
  .share{ display:inline-block; width:15px; height:15px; vertical-align:-3px; }
</style>
</head>
<body>
<div id="splash">
  <img src="icon-192.png" alt="">
  <h1>منصة اليقين</h1>
  <div class="dots"><span></span><span></span><span></span></div>
  <p id="hint">لحظات ونفتح لك المنصة…</p>
</div>

<iframe id="app" title="منصة اليقين" allow="geolocation; microphone; clipboard-write; autoplay; fullscreen"></iframe>

<div id="install" role="dialog" aria-label="تثبيت التطبيق">
  <img src="icon-192.png" alt="">
  <div class="t" id="itext"><b>ثبّت تطبيق اليقين</b><br>يطلع لك أيقونة على الشاشة ويفتح مثل أي تطبيق.</div>
  <button id="go">تثبيت</button>
  <button id="x" aria-label="إغلاق">✕</button>
</div>

<script>
  // رابط المنصة على Streamlit (لو تغيّر الرابط عدّله هنا بس)
  const SITE = "https://yaqeen-platform.streamlit.app/?embed=true&embed_options=dark_theme";

  const frame = document.getElementById("app"), splash = document.getElementById("splash");
  frame.src = SITE;
  frame.addEventListener("load", () => setTimeout(() => { splash.style.opacity = 0; setTimeout(() => splash.remove(), 500); }, 600));
  // Streamlit المجاني ينام إذا ما أحد فتحه فترة، أول فتحة تطوّل شوي
  setTimeout(() => { const h = document.getElementById("hint"); if (h) h.textContent = "المنصة تصحى من النوم… أول فتحة بعد فترة تاخذ دقيقة تقريبًا 🌙"; }, 6000);

  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

  // زر التثبيت
  const box = document.getElementById("install"), go = document.getElementById("go"), itext = document.getElementById("itext");
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  let dismissed = false; try { dismissed = localStorage.getItem("yq_install_x") === "1"; } catch (e) {}
  let deferred = null;
  window.addEventListener("beforeinstallprompt", e => {
    e.preventDefault(); deferred = e;
    if (!standalone && !dismissed) box.style.display = "flex";
  });
  if (ios && !standalone && !dismissed) {
    itext.innerHTML = '<b>ثبّت تطبيق اليقين على الآيفون</b><br>اضغط زر المشاركة ' +
      '<svg class="share" viewBox="0 0 24 24" fill="none" stroke="#f3dc9b" stroke-width="2"><path d="M12 3v12M7 8l5-5 5 5M5 12v8h14v-8"/></svg>' +
      ' تحت، وبعدها <b>إضافة إلى الشاشة الرئيسية</b>';
    go.style.display = "none";
    setTimeout(() => box.style.display = "flex", 2500);
  }
  go.onclick = async () => { if (!deferred) return; deferred.prompt(); await deferred.userChoice; deferred = null; box.style.display = "none"; };
  document.getElementById("x").onclick = () => { box.style.display = "none"; try { localStorage.setItem("yq_install_x", "1"); } catch (e) {} };
  window.addEventListener("appinstalled", () => { box.style.display = "none"; });
</script>
</body>
</html>
